# Application Configuration

# API settings
api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 4
  max_upload_size: 10485760  # 10MB in bytes
  allowed_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

# Paths
paths:
  models_dir: "models/weights"
  data_dir: "data"
  logs_dir: "logs"
  temp_dir: "temp"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Database (optional for storing identification history)
database:
  enabled: false
  type: "sqlite"  # sqlite, postgresql, mongodb
  path: "data/identifications.db"

# Caching
cache:
  enabled: true
  backend: "memory"  # memory, redis
  ttl: 3600  # seconds

# Security
security:
  api_key_required: false
  rate_limit:
    enabled: true
    requests_per_minute: 60
