<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfection Reagent Calculator</title>
    <style>
        /* Styling for the entire page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 5px solid #667eea;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results h2 {
            color: #667eea;
            margin-top: 0;
        }

        .result-item {
            margin: 15px 0;
            padding: 10px;
            background: white;
            border-radius: 5px;
        }

        .result-label {
            font-weight: 600;
            color: #555;
        }

        .result-value {
            color: #667eea;
            font-size: 18px;
            font-weight: bold;
        }

        .protocol-info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧬 Transfection Reagent Calculator</h1>
        <p class="subtitle">Calculate reagent amounts for your cellular transfections</p>

        <div class="info-box">
            <strong>ℹ️ How to use:</strong> Select your reagent and plate format, enter the number of wells you're transfecting, and click calculate. The calculator includes 10% overage for pipetting error.
        </div>

        <form id="transfection-form">
            <div class="form-group">
                <label for="reagent">Transfection Reagent:</label>
                <select id="reagent" required>
                    <option value="">-- Select Reagent --</option>
                    <option value="lipo2000">Lipofectamine 2000</option>
                    <option value="lipo3000">Lipofectamine 3000</option>
                    <option value="pei">PEI (Polyethylenimine)</option>
                    <option value="fugene">FuGENE HD</option>
                    <option value="jetprime">jetPRIME</option>
                </select>
            </div>

            <div class="grid">
                <div class="form-group">
                    <label for="plate-format">Plate Format:</label>
                    <select id="plate-format" required>
                        <option value="">-- Select Format --</option>
                        <option value="6">6-well plate</option>
                        <option value="12">12-well plate</option>
                        <option value="24">24-well plate</option>
                        <option value="48">48-well plate</option>
                        <option value="96">96-well plate</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="num-wells">Number of Wells:</label>
                    <input type="number" id="num-wells" min="1" placeholder="e.g., 3" required>
                </div>
            </div>

            <div class="form-group">
                <label for="dna-amount">DNA per Well (µg):</label>
                <input type="number" id="dna-amount" step="0.1" placeholder="Leave blank for default" min="0">
            </div>

            <button type="submit">Calculate Reagents</button>
        </form>

        <div id="results" class="results">
            <h2>📋 Your Protocol</h2>
            <div id="results-content"></div>
        </div>
    </div>

    <script>
        // Protocol database - contains all the information for different reagents and plate formats
        const protocols = {
            lipo2000: {
                name: "Lipofectamine 2000",
                ratio: 2.5, // µL reagent per µg DNA
                defaultDNA: {
                    6: 2.5,
                    12: 1.0,
                    24: 0.5,
                    48: 0.25,
                    96: 0.1
                },
                dilutionMedia: {
                    6: 250,
                    12: 100,
                    24: 50,
                    48: 25,
                    96: 10
                }
            },
            lipo3000: {
                name: "Lipofectamine 3000",
                ratio: 2.0,
                p3000Ratio: 2.0, // µL P3000 per µg DNA
                defaultDNA: {
                    6: 2.5,
                    12: 1.0,
                    24: 0.5,
                    48: 0.25,
                    96: 0.1
                },
                dilutionMedia: {
                    6: 125,
                    12: 50,
                    24: 25,
                    48: 12.5,
                    96: 5
                }
            },
            pei: {
                name: "PEI (1 mg/mL)",
                ratio: 3.0, // µL per µg DNA (3:1 ratio)
                defaultDNA: {
                    6: 2.5,
                    12: 1.0,
                    24: 0.5,
                    48: 0.25,
                    96: 0.1
                },
                dilutionMedia: {
                    6: 250,
                    12: 100,
                    24: 50,
                    48: 25,
                    96: 10
                }
            },
            fugene: {
                name: "FuGENE HD",
                ratio: 3.0,
                defaultDNA: {
                    6: 2.5,
                    12: 1.0,
                    24: 0.5,
                    48: 0.25,
                    96: 0.1
                },
                dilutionMedia: {
                    6: 250,
                    12: 100,
                    24: 50,
                    48: 25,
                    96: 10
                }
            },
            jetprime: {
                name: "jetPRIME",
                ratio: 2.0,
                defaultDNA: {
                    6: 2.0,
                    12: 1.0,
                    24: 0.5,
                    48: 0.25,
                    96: 0.1
                },
                dilutionMedia: {
                    6: 200,
                    12: 100,
                    24: 50,
                    48: 25,
                    96: 10
                }
            }
        };

        // This function runs when the form is submitted
        document.getElementById('transfection-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page reload
            calculateReagents();
        });

        function calculateReagents() {
            // Get user inputs
            const reagentType = document.getElementById('reagent').value;
            const plateFormat = document.getElementById('plate-format').value;
            const numWells = parseInt(document.getElementById('num-wells').value);
            const customDNA = parseFloat(document.getElementById('dna-amount').value);

            // Get the protocol for selected reagent
            const protocol = protocols[reagentType];

            // Determine DNA amount (use custom or default)
            const dnaPerWell = customDNA || protocol.defaultDNA[plateFormat];

            // Calculate total amounts with 10% overage
            const overage = 1.10;
            const totalDNA = (dnaPerWell * numWells * overage).toFixed(2);
            const totalReagent = (dnaPerWell * protocol.ratio * numWells * overage).toFixed(2);
            const totalDilutionMedia = (protocol.dilutionMedia[plateFormat] * numWells * overage).toFixed(2);

            // Build results HTML
            let resultsHTML = `
                <div class="result-item">
                    <span class="result-label">Reagent:</span>
                    <span class="result-value">${protocol.name}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Plate Format:</span>
                    <span class="result-value">${plateFormat}-well plate</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Number of Wells:</span>
                    <span class="result-value">${numWells} wells</span>
                </div>
                <div class="result-item">
                    <span class="result-label">DNA per Well:</span>
                    <span class="result-value">${dnaPerWell} µg</span>
                </div>
                <hr>
                <div class="result-item">
                    <span class="result-label">Total DNA Needed:</span>
                    <span class="result-value">${totalDNA} µg</span>
                </div>
                <div class="result-item">
                    <span class="result-label">Total ${protocol.name}:</span>
                    <span class="result-value">${totalReagent} µL</span>
                </div>
            `;

            // Add P3000 for Lipofectamine 3000
            if (reagentType === 'lipo3000') {
                const totalP3000 = (dnaPerWell * protocol.p3000Ratio * numWells * overage).toFixed(2);
                resultsHTML += `
                    <div class="result-item">
                        <span class="result-label">Total P3000 Reagent:</span>
                        <span class="result-value">${totalP3000} µL</span>
                    </div>
                `;
            }

            resultsHTML += `
                <div class="result-item">
                    <span class="result-label">Serum-Free Media (for dilution):</span>
                    <span class="result-value">${totalDilutionMedia} µL per tube</span>
                </div>
                <div class="protocol-info">
                    <strong>📝 Protocol Steps:</strong><br><br>
                    <strong>Tube 1:</strong> Dilute ${totalDNA} µg DNA in ${totalDilutionMedia} µL serum-free media. Mix gently.<br><br>
                    <strong>Tube 2:</strong> Dilute ${totalReagent} µL ${protocol.name} in ${totalDilutionMedia} µL serum-free media. Mix gently.${reagentType === 'lipo3000' ? `<br><br><strong>Note:</strong> Add P3000 to Tube 1 with the DNA before mixing.` : ''}<br><br>
                    <strong>Combine:</strong> Add Tube 2 to Tube 1. Mix gently and incubate for ${reagentType === 'pei' ? '15-20' : '5-20'} minutes at room temperature.<br><br>
                    <strong>Add to cells:</strong> Add the complex dropwise to cells in ${plateFormat}-well plate. Gently rock the plate.<br><br>
                    <em>⚠️ Amounts include 10% overage for pipetting error.</em>
                </div>
            `;

            // Display results
            document.getElementById('results-content').innerHTML = resultsHTML;
            document.getElementById('results').classList.add('show');

            // Scroll to results
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
